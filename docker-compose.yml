version: '3.8'

services:
  app:
    build: .
    container_name: petshop_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:DmcZrV9zVq8E5Habrqm+JWKQllmH2YtZEu6fz6m1QBs=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=petshoop
      - DB_USERNAME=root
      - DB_PASSWORD=SenhaForteSegura123!
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - petshop-network

  db:
    image: mysql:8.0
    container_name: petshop_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: petshoop
      MYSQL_ROOT_PASSWORD: SenhaForteSegura123!
      MYSQL_PASSWORD: SenhaForteSegura123!
      MYSQL_USER: root
    # Nota: A porta 3306 do MySQL NÃO está sendo mapeada para o host (sem a seção 'ports'), 
    # garantindo isolamento total e segurança.
    volumes:
      - petshop_db_data:/var/lib/mysql
    networks:
      - petshop-network

networks:
  petshop-network:
    driver: bridge

volumes:
  petshop_db_data:
    driver: local