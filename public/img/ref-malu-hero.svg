<svg class="hero-image" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração da Mascote Malu, uma pug carismática, sorridente e cheia de amor">
          <defs>
            <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0f766e" />
              <stop offset="50%" stop-color="#115e59" />
              <stop offset="100%" stop-color="#042f2e" />
            </linearGradient>
            <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#99f6e4" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="pugCoat" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#f5e0c3" />
              <stop offset="50%" stop-color="#e9cca3" />
              <stop offset="100%" stop-color="#d6b384" />
            </linearGradient>
            <linearGradient id="pugMask" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#36251e" />
              <stop offset="100%" stop-color="#1a110d" />
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
            </filter>
          </defs>

          <!-- Fundo base com degradê verde-água profundo -->
          <rect width="1200" height="650" fill="url(#heroBgGrad)" />

          <!-- Círculos de luz quente e acolhedora -->
          <circle cx="580" cy="300" r="380" fill="url(#warmGlow)" />
          <circle cx="300" cy="180" r="240" fill="#2dd4bf" opacity="0.12" />

          <!-- Doodles de Fundo: Patinhas e Ossos decorativos -->
          <g opacity="0.32" fill="#99f6e4">
            <!-- Patinha topo esquerda -->
            <g transform="translate(140, 80) scale(0.9) rotate(-15)">
              <circle cx="15" cy="18" r="5" />
              <circle cx="27" cy="12" r="5" />
              <circle cx="39" cy="18" r="5" />
              <path d="M27,24 C18,24 14,32 17,39 C20,44 34,44 37,39 C40,32 36,24 27,24 Z" />
            </g>
            <!-- Patinha direita -->
            <g transform="translate(980, 110) scale(1.1) rotate(25)">
              <circle cx="15" cy="18" r="5" />
              <circle cx="27" cy="12" r="5" />
              <circle cx="39" cy="18" r="5" />
              <path d="M27,24 C18,24 14,32 17,39 C20,44 34,44 37,39 C40,32 36,24 27,24 Z" />
            </g>
            <!-- Patinha centro baixo -->
            <g transform="translate(420, 480) scale(1) rotate(10)" fill="#fef08a" opacity="0.7">
              <circle cx="15" cy="18" r="5" />
              <circle cx="27" cy="12" r="5" />
              <circle cx="39" cy="18" r="5" />
              <path d="M27,24 C18,24 14,32 17,39 C20,44 34,44 37,39 C40,32 36,24 27,24 Z" />
            </g>
          </g>

          <!-- Doodles de Corações flutuantes ao redor da Malu -->
          <g>
            <path d="M520,130 C520,130 502,110 502,96 C502,88 508,82 516,82 C521,82 524,86 524,86 C524,86 527,82 532,82 C540,82 546,88 546,96 C546,110 528,130 528,130 Z" fill="#fda4af" opacity="0.9" />
            <path d="M680,160 C680,160 666,145 666,134 C666,128 671,123 677,123 C681,123 683,126 683,126 C683,126 685,123 689,123 C695,123 700,128 700,134 C700,145 686,160 686,160 Z" fill="#f43f5e" opacity="0.85" />
            <path d="M460,240 C460,240 448,226 448,216 C448,210 452,206 458,206 C462,206 464,208 464,208 C464,208 466,206 470,206 C476,206 480,210 480,216 C480,226 468,240 468,240 Z" fill="#fda4af" opacity="0.75" />
            <path d="M720,290 C720,290 706,274 706,262 C706,256 711,250 717,250 C721,250 724,253 724,253 C724,253 727,250 731,250 C737,250 742,256 742,262 C742,274 728,290 728,290 Z" fill="#f472b6" opacity="0.8" />
          </g>

          <!-- Brilhos / Estrelinhas Doodle -->
          <g stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
            <line x1="490" y1="180" x2="490" y2="194" />
            <line x1="483" y1="187" x2="497" y2="187" />
            <line x1="695" y1="210" x2="695" y2="222" />
            <line x1="689" y1="216" x2="701" y2="216" />
          </g>

          <!-- A GRANDE MASCOTE MALU (PUG SORRIDENTE E CARISMÁTICA) -->
          <g filter="url(#softShadow)" transform="translate(560, 140)">
            <!-- Corpo e peito gordinho da pug Malu -->
            <ellipse cx="60" cy="350" rx="145" ry="120" fill="url(#pugCoat)" />
            <!-- Patinhas dianteiras apoiadas com carinho -->
            <ellipse cx="-20" cy="420" rx="38" ry="28" fill="#ecd2af" stroke="#cca678" stroke-width="2" />
            <path d="M-32,422 Q-32,434 -32,438 M-20,424 Q-20,436 -20,440 M-8,422 Q-8,434 -8,438" stroke="#cca678" stroke-width="2.5" stroke-linecap="round" />
            <ellipse cx="140" cy="420" rx="38" ry="28" fill="#ecd2af" stroke="#cca678" stroke-width="2" />
            <path d="M128,422 Q128,434 128,438 M140,424 Q140,436 140,440 M152,422 Q152,434 152,438" stroke="#cca678" stroke-width="2.5" stroke-linecap="round" />

            <!-- Coleira verde-água estilosa com medalhinha de ouro "Malu" -->
            <path d="M-40,285 Q60,330 160,285 Q165,305 155,315 Q60,355 -35,315 Z" fill="#0d9488" stroke="#115e59" stroke-width="3" />
            <!-- Medalha dourada gravada "MALU" -->
            <circle cx="60" cy="340" r="26" fill="#f59e0b" stroke="#fef08a" stroke-width="3" />
            <circle cx="60" cy="340" r="21" fill="#fbbf24" />
            <text x="60" y="345" font-family="'Quicksand', system-ui, sans-serif" font-weight="800" font-size="11" fill="#78350f" text-anchor="middle">MALU</text>

            <!-- Orelhas pretas caídas de pug com dobras aveludadas -->
            <!-- Orelha esquerda -->
            <path d="M-60,50 C-105,80 -105,150 -55,160 C-30,125 -30,70 -60,50 Z" fill="#261b17" stroke="#1b120f" stroke-width="2" />
            <path d="M-75,85 C-60,115 -50,135 -45,150" stroke="#3b2b24" stroke-width="3" stroke-linecap="round" />
            <!-- Orelha direita -->
            <path d="M180,50 C225,80 225,150 175,160 C150,125 150,70 180,50 Z" fill="#261b17" stroke="#1b120f" stroke-width="2" />
            <path d="M195,85 C180,115 170,135 165,150" stroke="#3b2b24" stroke-width="3" stroke-linecap="round" />

            <!-- Cabeça arredondada grande e fofa (Bege / Fawn clássico) -->
            <rect x="-65" y="35" width="250" height="225" rx="100" fill="url(#pugCoat)" stroke="#cca678" stroke-width="3" />

            <!-- Dobras características da testa do pug (rugas fofas da Malu) -->
            <g stroke="#78533d" stroke-width="3.5" stroke-linecap="round" fill="none">
              <!-- Rugas superiores em diamante/arco -->
              <path d="M20,62 Q60,45 100,62" />
              <path d="M28,82 Q60,65 92,82" />
              <path d="M45,55 L60,95 L75,55" stroke-width="2.5" />
              <path d="M10,105 Q60,92 110,105" />
              <path d="M18,126 Q60,116 102,126" />
            </g>

            <!-- Olhos grandes, redondos, brilhantes e carismáticos de Pug -->
            <!-- Olho esquerdo -->
            <ellipse cx="12" cy="145" rx="22" ry="24" fill="#180f0a" />
            <circle cx="6" cy="135" r="8" fill="#ffffff" />
            <circle cx="18" cy="152" r="3.5" fill="#ffffff" />
            <!-- Olho direito -->
            <ellipse cx="108" cy="145" rx="22" ry="24" fill="#180f0a" />
            <circle cx="102" cy="135" r="8" fill="#ffffff" />
            <circle cx="114" cy="152" r="3.5" fill="#ffffff" />

            <!-- Sobrancelhas expressivas e felizes -->
            <path d="M-5,116 Q15,108 30,118" stroke="#52392b" stroke-width="3.5" stroke-linecap="round" fill="none" />
            <path d="M90,118 Q105,108 125,116" stroke="#52392b" stroke-width="3.5" stroke-linecap="round" fill="none" />

            <!-- Máscara negra aveludada do focinho -->
            <path d="M-8,160 C-8,140 18,135 60,135 C102,135 128,140 128,160 C136,200 122,250 60,250 C-2,250 -16,200 -8,160 Z" fill="url(#pugMask)" />

            <!-- Grande dobra superior do focinho -->
            <path d="M22,154 Q60,144 98,154" stroke="#52392b" stroke-width="4" stroke-linecap="round" fill="none" />
            <path d="M30,165 Q60,157 90,165" stroke="#422e23" stroke-width="3" stroke-linecap="round" fill="none" />

            <!-- Nariz clássico achatado de pug -->
            <path d="M44,175 C44,166 52,163 60,163 C68,163 76,166 76,175 C72,190 48,190 44,175 Z" fill="#0d0806" />
            <ellipse cx="52" cy="179" rx="3" ry="4" fill="#261b17" />
            <ellipse cx="68" cy="179" rx="3" ry="4" fill="#261b17" />
            <circle cx="56" cy="171" r="2" fill="#523d34" />

            <!-- Pontinhos de bigode nas bochechas fofas -->
            <circle cx="18" cy="192" r="2.2" fill="#120c09" />
            <circle cx="28" cy="198" r="2.2" fill="#120c09" />
            <circle cx="20" cy="208" r="2.2" fill="#120c09" />
            <circle cx="102" cy="192" r="2.2" fill="#120c09" />
            <circle cx="92" cy="198" r="2.2" fill="#120c09" />
            <circle cx="100" cy="208" r="2.2" fill="#120c09" />

            <!-- Boca aberta com sorriso radiante e linguinha rosada da Malu -->
            <path d="M38,206 Q60,222 82,206" stroke="#e9cca3" stroke-width="3" stroke-linecap="round" fill="none" />
            <!-- Interior da boca e língua cheia de vida -->
            <path d="M46,212 C46,212 46,242 60,242 C74,242 74,212 74,212 Z" fill="#be185d" />
            <path d="M48,214 C48,228 50,248 60,248 C70,248 72,228 72,214 C65,220 55,220 48,214 Z" fill="#f472b6" stroke="#db2777" stroke-width="1.5" />
            <!-- Linha central da língua da pug -->
            <line x1="60" y1="220" x2="60" y2="242" stroke="#db2777" stroke-width="2" stroke-linecap="round" />
          </g>
        </svg>