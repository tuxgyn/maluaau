<svg class="about-main-img" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração da pug Malu recebendo cuidados carinhosos na clínica">
          <defs>
            <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ccfbf1" />
              <stop offset="50%" stop-color="#e6fffa" />
              <stop offset="100%" stop-color="#fef3c7" />
            </linearGradient>
            <linearGradient id="warmHeart" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f43f5e" />
              <stop offset="100%" stop-color="#be185d" />
            </linearGradient>
          </defs>

          <!-- Fundo pastel calmo -->
          <rect width="800" height="600" fill="url(#aboutBg)" />

          <!-- Círculos decorativos e doodles -->
          <circle cx="400" cy="300" r="250" fill="#ffffff" opacity="0.65" />
          <circle cx="160" cy="140" r="60" fill="#fef08a" opacity="0.5" />
          <circle cx="680" cy="460" r="80" fill="#99f6e4" opacity="0.5" />

          <!-- Patinhas e corações decorativos -->
          <path d="M220,130 C220,130 205,115 205,105 C205,99 210,95 216,95 C220,95 222,97 222,97 C222,97 224,95 228,95 C234,95 239,99 239,105 C239,115 224,130 224,130 Z" fill="#fda4af" />
          <path d="M580,180 C580,180 568,168 568,160 C568,155 572,152 577,152 C580,152 582,154 582,154 C582,154 584,152 587,152 C592,152 596,155 596,160 C596,168 584,180 584,180 Z" fill="#fda4af" />

          <!-- A Pug Malu descansando feliz numa almofada macia -->
          <g transform="translate(400, 310)">
            <!-- Almofada fofinha -->
            <ellipse cx="0" cy="130" rx="230" ry="65" fill="#0d9488" opacity="0.9" />
            <ellipse cx="0" cy="120" rx="215" ry="55" fill="#14b8a6" />

            <!-- Corpo da Malu encolhidinho e confortável -->
            <ellipse cx="0" cy="65" rx="130" ry="90" fill="#edd2af" stroke="#d4b07e" stroke-width="3" />
            <!-- Patinhas dianteiras relaxadas -->
            <ellipse cx="-45" cy="115" rx="30" ry="20" fill="#edd2af" stroke="#d4b07e" stroke-width="2" />
            <ellipse cx="45" cy="115" rx="30" ry="20" fill="#edd2af" stroke="#d4b07e" stroke-width="2" />

            <!-- Coleira teal com medalhinha da Malu -->
            <path d="M-55,20 Q0,50 55,20" stroke="#0f766e" stroke-width="12" stroke-linecap="round" fill="none" />
            <circle cx="0" cy="42" r="14" fill="#f59e0b" stroke="#fef08a" stroke-width="2" />

            <!-- Orelhas pretas caídas da Malu -->
            <path d="M-85,-65 C-115,-35 -110,15 -75,20 C-60,-5 -60,-40 -85,-65 Z" fill="#2b1f1a" />
            <path d="M85,-65 C115,-35 110,15 75,20 C60,-5 60,-40 85,-65 Z" fill="#2b1f1a" />

            <!-- Cabeça charmosa da pug -->
            <rect x="-85" y="-80" width="170" height="150" rx="68" fill="#edd2af" stroke="#d4b07e" stroke-width="3" />

            <!-- Rugas fofas da testa -->
            <path d="M-30,-50 Q0,-62 30,-50" stroke="#78533d" stroke-width="3" stroke-linecap="round" fill="none" />
            <path d="M-22,-36 Q0,-46 22,-36" stroke="#78533d" stroke-width="2.6" stroke-linecap="round" fill="none" />
            <path d="M-35,-20 Q0,-30 35,-20" stroke="#78533d" stroke-width="2.6" stroke-linecap="round" fill="none" />

            <!-- Olhos brilhantes e meigos fechando de soninho bom -->
            <path d="M-45,-4 Q-30,12 -15,-4" stroke="#1b120c" stroke-width="4.5" stroke-linecap="round" fill="none" />
            <path d="M15,-4 Q30,12 45,-4" stroke="#1b120c" stroke-width="4.5" stroke-linecap="round" fill="none" />

            <!-- Máscara escura e focinho achatado -->
            <ellipse cx="0" cy="30" rx="55" ry="38" fill="#2b1f1a" />
            <path d="M-12,22 C-12,16 -4,14 0,14 C4,14 12,16 12,22 C9,30 -9,30 -12,22 Z" fill="#120c09" />
            <!-- Linguinha para fora -->
            <path d="M-8,46 C-8,58 8,58 8,46 Z" fill="#f472b6" stroke="#db2777" stroke-width="1.2" />

            <!-- Mão carinhosa acariciando a cabeça da Malu -->
            <g transform="translate(-60, -110)">
              <path d="M-40,-30 Q20,-10 60,10 Q80,20 100,0 Q90,-20 50,-35 Z" fill="#fed7aa" stroke="#fcd34d" stroke-width="2" />
              <!-- Coração flutuando do carinho -->
              <path d="M70,-20 C70,-20 62,-28 62,-34 C62,-38 65,-40 69,-40 C71,-40 73,-39 73,-39 C73,-39 75,-40 77,-40 C81,-40 84,-38 84,-34 C84,-28 76,-20 76,-20 Z" fill="url(#warmHeart)" />
            </g>
          </g>

          <!-- Termômetro / kit saúde amigável estilizado -->
          <g transform="translate(110, 410) scale(0.9)">
            <rect x="0" y="0" width="85" height="85" rx="20" fill="#ffffff" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.08))" />
            <!-- Cruz verde da saúde pet -->
            <rect x="36" y="20" width="13" height="45" rx="5" fill="#0d9488" />
            <rect x="20" y="36" width="45" height="13" rx="5" fill="#0d9488" />
          </g>
        </svg>